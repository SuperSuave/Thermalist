services:
  thermalist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermalist-dev
    ports:
      - "11575:11575"
    labels:
      proxy.aliases: thermalist
      proxy.thermalist.port: 11575
      proxy.thermalist.middlewares.oidc: null
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./config.yaml:/app/config.yaml:ro
    environment:
      TZ: America/Los_Angeles
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "11575",
        "--reload",
      ]
