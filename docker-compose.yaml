services:
  thermalist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermalist
    ports:
      - 11575:11575
    labels:
      proxy.aliases: thermalist
      proxy.thermalist.port: 11575
      proxy.thermalist.middlewares.oidc: null
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      TZ: America/Los_Angeles
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:11575/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
networks: {}
